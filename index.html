<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字里乾坤</title>
  <style>
    :root {
      --paper-base: #f4ede2;
      --paper-texture: #e9decb;
      --ink: #1b1918;
      --cinnabar: #a62b24;
      --cinnabar-light: #e8d5c4;
      --wood: #4a3728;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Serif SC", "Kaiti SC", STKaiti, serif;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--paper-base);
      background-image: radial-gradient(var(--paper-texture) 15%, transparent 16%), radial-gradient(var(--paper-texture) 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航：精简标题与语言切换在一行 */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--wood);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .seal-box {
      background: var(--cinnabar);
      color: #fff;
      font-size: 13px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 1px 1px 0 rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.15rem;
      color: var(--wood);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .lang-group {
      display: flex;
      gap: 2px;
      background: #e3d8c8;
      padding: 3px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--wood);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .lang-btn.active {
      background: var(--wood);
      color: #fff;
    }

    /* 主布局 */
    .main-wrap {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 14px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      .main-wrap {
        grid-template-columns: 1fr;
      }
    }

    /* 左侧控制区 */
    .panel {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      border: 1px solid #d5c8b5;
      padding: 16px;
      box-shadow: 0 8px 20px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cinnabar);
      border-left: 4px solid var(--cinnabar);
      padding-left: 8px;
    }

    .char-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .char-pill {
      border: 1px solid #d3c4af;
      border-radius: 8px;
      padding: 8px 0;
      background: #faf6f0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .char-pill .ancient-preview {
      width: 28px;
      height: 28px;
      fill: var(--ink);
    }

    .char-pill .modern-txt {
      font-size: 11px;
      font-weight: bold;
      margin-top: 3px;
      color: #666;
    }

    .char-pill.active, .char-pill:hover {
      border-color: var(--cinnabar);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(166, 43, 36, 0.15);
    }

    .char-pill.active .modern-txt {
      color: var(--cinnabar);
    }

    .evolution-box {
      background: #fdfaf6;
      border: 1px dashed #cfc2ae;
      border-radius: 10px;
      padding: 10px 6px;
    }

    .evolution-timeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      align-items: center;
    }

    .evo-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 2px;
      border-radius: 6px;
      transition: background 0.2s, transform 0.2s;
    }

    .evo-glyph {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .evo-glyph svg {
      width: 100%;
      height: 100%;
      stroke: var(--ink);
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .evo-glyph span {
      font-size: 22px;
      font-weight: 500;
    }

    .evo-name {
      font-size: 10px;
      color: #7b6d5e;
      font-weight: 600;
    }

    .play-morph-btn {
      width: 100%;
      border: 1px solid var(--cinnabar);
      background: #fdf2f1;
      color: var(--cinnabar);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .play-morph-btn:hover {
      background: var(--cinnabar);
      color: white;
    }

    .etymology-box {
      font-size: 0.88rem;
      line-height: 1.65;
      color: #3e3328;
      background: #faf6f0;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #b5a28c;
    }

    /* 右侧互动画板 */
    .workshop {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    /* 模式切换小胶囊：避免手机滑动误触画板 */
    .touch-mode-switch {
      display: inline-flex;
      background: #e5dac9;
      padding: 3px;
      border-radius: 20px;
      gap: 4px;
      font-size: 0.78rem;
    }

    .touch-btn {
      border: none;
      background: transparent;
      padding: 4px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      color: var(--wood);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .touch-btn.active {
      background: var(--wood);
      color: #fff;
    }

    .canvas-desk {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      background: #fffefb;
      border: 3px solid var(--wood);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .mige {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background:
        linear-gradient(to right, var(--cinnabar) 1px, transparent 1px) 50% 0 / 100% 100%,
        linear-gradient(to bottom, var(--cinnabar) 1px, transparent 1px) 0 50% / 100% 100%,
        linear-gradient(45deg, transparent 49.6%, var(--cinnabar) 50%, transparent 50.4%),
        linear-gradient(-45deg, transparent 49.6%, var(--cinnabar) 50%, transparent 50.4%);
    }

    .trace-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.22;
      transition: opacity 0.3s;
    }

    .trace-layer svg {
      width: 72%;
      height: 72%;
      stroke: var(--ink);
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* 当切换为滑屏模式时，画板穿透点击，方便上下滑 */
    canvas.scroll-mode {
      pointer-events: none;
    }

    .desk-bar {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      border: 1px solid #dcd1c2;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .tools-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .tools-right {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #c7b9a5;
      background: white;
      color: var(--wood);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #f4eee3;
    }

    .action-btn.primary {
      background: var(--cinnabar);
      color: white;
      border-color: var(--cinnabar);
    }

    .action-btn.primary:hover {
      background: #8b231c;
    }

    /* 趣味评分印章 */
    .score-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 96px;
      height: 96px;
      border: 3px dashed var(--cinnabar);
      border-radius: 50%;
      color: var(--cinnabar);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(-15deg) scale(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(255, 240, 240, 0.92);
      pointer-events: none;
      z-index: 20;
    }

    .score-badge.show {
      transform: rotate(-15deg) scale(1);
    }

    .score-num {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1;
    }

    .score-txt {
      font-size: 10px;
      font-weight: bold;
      margin-top: 3px;
    }

    .score-sub {
      font-size: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="seal-box" id="logoTag">象形</div>
        <!-- 标题精简为：字里乾坤 -->
        <h1 id="mainTitle">字里乾坤</h1>
      </div>
      <div class="lang-group">
        <button class="lang-btn active" onclick="setLang('zh')">中文</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ms')">BM</button>
      </div>
    </div>
  </header>

  <main class="main-wrap">
    <aside class="panel">
      <div>
        <div class="panel-title" id="tChooseChar">
          <span>选择字例</span>
        </div>
        <div class="char-selector" id="charList" style="margin-top: 10px;"></div>
      </div>

      <div>
        <div class="panel-title" id="tEvolution">
          <span>字形演变轨迹</span>
        </div>
        <div class="evolution-box" style="margin-top: 10px;">
          <div class="evolution-timeline" id="evoTimeline"></div>
          <button class="play-morph-btn" style="margin-top: 10px;" onclick="playEvolution()" id="btnPlayEvo">
            ▶ 动态演示演变过程
          </button>
        </div>
      </div>

      <div>
        <div class="panel-title" id="tEtymology">
          <span>造字本义与释读</span>
        </div>
        <div class="etymology-box" id="etymologyContent" style="margin-top: 10px;"></div>
      </div>
    </aside>

    <section class="workshop">
      <!-- 模式切换：解决在手机上滑动误抹画面的痛点 -->
      <div class="touch-mode-switch">
        <button class="touch-btn active" id="btnModeDraw" onclick="setCanvasMode('draw')">
          ✍️ <span id="lblModeDraw">书写模式</span>
        </button>
        <button class="touch-btn" id="btnModeScroll" onclick="setCanvasMode('scroll')">
          ✋ <span id="lblModeScroll">滑屏模式</span>
        </button>
      </div>

      <div class="canvas-desk" id="deskContainer">
        <div class="mige"></div>
        <div class="trace-layer" id="traceBox"></div>
        <canvas id="paintCanvas" width="800" height="800"></canvas>
        
        <div class="score-badge" id="scoreBadge">
          <span class="score-num" id="scoreVal">92</span>
          <span class="score-txt" id="scoreVerdict">入木三分</span>
          <span class="score-sub" id="scoreSub">契合度评分</span>
        </div>
      </div>

      <div class="desk-bar">
        <div class="tools-left">
          <label style="cursor: pointer;">
            <input type="checkbox" id="chkGuide" checked onchange="toggleGuide(this.checked)">
            <span id="txtGuide">描红提示</span>
          </label>
          <label>
            <span id="txtBrush">笔触</span>:
            <input type="range" id="penSize" min="10" max="36" value="18" style="vertical-align: middle; width: 60px;">
          </label>
        </div>

        <div class="tools-right">
          <button class="action-btn" onclick="wipeBoard()" id="btnWipe">清空</button>
          <button class="action-btn" onclick="evaluateRealScore()" id="btnGrade" style="background: #fdf3e7; color: #a65b00; border-color: #f1cf9b;">
            测契合度
          </button>
          <button class="action-btn primary" onclick="exportPainting()" id="btnExport">盖印保存</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const etymologyData = [
      {
        id: "sun",
        modern: "日",
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<ellipse cx="50" cy="50" rx="30" ry="34" stroke-width="7"/><circle cx="50" cy="50" r="7" fill="#1b1918"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M28 26 C42 22 58 22 72 26 L74 65 C74 76 66 84 50 84 C34 84 26 76 26 65 Z" stroke-width="7"/><line x1="50" y1="46" x2="50" y2="58" stroke-width="8"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M30 22 L70 22 L70 64 C70 78 30 78 30 64 Z" stroke-width="6"/><line x1="30" y1="48" x2="70" y2="48" stroke-width="6"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, text: "日" },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, text: "日" }
        ],
        traceSvg: `<ellipse cx="50" cy="50" rx="30" ry="34" /><circle cx="50" cy="50" r="7" fill="#1b1918" />`,
        info: {
          zh: "象形字。外层不规则圆轮象征发光浑圆的太阳，中心一实体粗圆点表示并非空心发光体。《说文解字》：“日，实也。太阳之精。象形。”体现古人对实体重力天体的敏锐观察。",
          en: "Pictograph of the sun. The outer circular outline mirrors the silhouette of the sun, while the solid core mark signifies it as a substantial luminous celestial body.",
          ms: "Aksara piktografik matahari. Bentuk bulatan di luar mencerminkan matahari yang memancar, manakala titik padu di tengah menandakan ketumpatan jasad cakerawala yang nyata."
        }
      },
      {
        id: "moon",
        modern: "月",
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M38 18 C37 40 37 60 38 82 C56 75 66 58 64 24 Z" stroke-width="6"/><ellipse cx="49" cy="50" rx="2.5" ry="6" fill="#1b1918"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M32 20 C50 22 66 38 66 56 C66 74 35 84 32 84 C48 72 48 34 32 20 Z" stroke-width="7"/><line x1="49" y1="46" x2="49" y2="58" stroke-width="7"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M36 28 C50 16 66 22 66 46 C66 68 46 80 46 90" stroke-width="6"/><line x1="36" y1="42" x2="58" y2="42" stroke-width="5"/><line x1="38" y1="62" x2="56" y2="62" stroke-width="5"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, text: "月" },
          { name: { zh: "楷体", en: "Regular", ms: "Biasa" }, text: "月" }
        ],
        traceSvg: `<path d="M38 18 C37 40 37 60 38 82 C56 75 66 58 64 24 Z" /><ellipse cx="49" cy="50" rx="2.5" ry="6" fill="#1b1918"/>`,
        info: {
          zh: "象形字。古人绘制月亮特意采用蛾眉月/半弦月形态，并在内侧加一阴影竖画。因月亮多亏缺而少圆满，以此与浑圆的“日”形成鲜明对比。《说文》：“月，阙也。太阴之精。”",
          en: "Pictograph representing the moon. Drawn as a crescent with a core mark to capture waxing and waning phases, deliberately distinguishing it from the full circular sun.",
          ms: "Piktograf berbentuk bulan sabit. Dilukis melengkung separa penuh bagi mencerminkan fasa bulan yang berubah-ubah, sekali gus membezakannya daripada matahari yang bulat."
        }
      },
      {
        id: "mountain",
        modern: "山",
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M18 78 L28 32 L40 78 M36 78 L50 20 L64 78 M60 78 L72 36 L82 78 M18 78 L82 78" stroke-width="6"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M22 48 L22 75 L78 75 L78 48 M50 20 L50 75" stroke-width="7"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M26 24 L26 62 C26 76 74 76 74 62 L74 24 M50 16 L50 64 M34 72 L50 60 L66 72" stroke-width="6"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, text: "山" },
          { name: { zh: "楷体", en: "Regular", ms: "Biasa" }, text: "山" }
        ],
        traceSvg: `<path d="M18 78 L28 32 L40 78 M36 78 L50 20 L64 78 M60 78 L72 36 L82 78 M18 78 L82 78"/>`,
        info: {
          zh: "象形字。甲骨文宛如大地上起伏矗立的三座险峻山峰，中间主峰突起，两侧侧峰环绕，底部基石相连。《说文》：“山，宣也。宣气散，生万物，有石而高。”",
          en: "Pictograph of three jagged peaks rising together from a common ground line. The towering center peak flanked by two side ridges captures a grand mountain range.",
          ms: "Piktograf menggambarkan tiga puncak gunung yang bersambung pada dasarnya. Puncak tengah yang paling tinggi melambangkan banjaran yang menjulang ke langit."
        }
      },
      {
        id: "water",
        modern: "水",
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M50 20 Q44 38 52 50 Q56 65 48 82" stroke-width="6"/><path d="M38 24 L36 34 M35 62 L38 74 M62 26 L64 36 M63 60 L60 72" stroke-width="5"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M46 22 C38 38 58 58 48 82" stroke-width="8"/><ellipse cx="36" cy="32" rx="3" ry="5" fill="#1b1918"/><ellipse cx="64" cy="34" rx="3" ry="5" fill="#1b1918"/><ellipse cx="34" cy="68" rx="3" ry="5" fill="#1b1918"/><ellipse cx="66" cy="68" rx="3" ry="5" fill="#1b1918"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M50 18 L50 82 M50 36 C34 40 32 64 32 82 M50 36 C66 40 68 64 68 82 M50 22 C34 26 28 42 28 50 M50 22 C66 26 72 42 72 50" stroke-width="5"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, text: "水" },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, text: "水" }
        ],
        traceSvg: `<path d="M50 20 Q44 38 52 50 Q56 65 48 82" /><path d="M38 24 L36 34 M35 62 L38 74 M62 26 L64 36 M63 60 L60 72"/>`,
        info: {
          zh: "象形字。中道为蜿蜒流淌的急流浪花，两侧散落断续的小点象征飞溅的水滴波纹。《说文》：“水，准也。数五行，象众水并流，中有微阳之气也。”",
          en: "Pictograph capturing rippling flowing water. The central sinuous curve reflects a river channel, flanked by dots and splashes denoting water droplets.",
          ms: "Piktograf menggambarkan air yang mengalir berliku-liku. Garisan beralun di tengah ialah aliran sungai, manakala titik-titik di sisi menandakan percikan air."
        }
      },
      {
        id: "person",
        modern: "人",
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M38 28 C45 28 58 35 56 46 C54 58 48 70 48 84 M46 42 L34 60" stroke-width="6"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M42 24 C50 26 62 36 60 52 L60 84 M50 48 L34 66" stroke-width="9"/>` },

          { name: { zh: "楷体", en: "Regular", ms: "Biasa" }, text: "人" }
        ],
        traceSvg: `<path d="M38 28 C45 28 58 35 56 46 C54 58 48 70 48 84 M46 42 L34 60"/>`,
        info: {

      {
        id: "tree",
        modern: "木",
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<line x1="50" y1="18" x2="50" y2="82" stroke-width="7"/><path d="M50 44 L32 24 M50 44 L68 24 M50 56 L30 80 M50 56 L70 80" stroke-width="6"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<line x1="50" y1="18" x2="50" y2="82" stroke-width="9"/><path d="M50 42 L28 26 M50 42 L72 26 M50 56 L26 78 M50 56 L74 78" stroke-width="8"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<line x1="50" y1="18" x2="50" y2="84" stroke-width="6"/><path d="M28 24 C28 50 50 42 50 42 C50 42 72 50 72 24 M50 42 C34 56 30 76 28 84 M50 42 C66 56 70 76 72 84" stroke-width="6"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, text: "木" },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, text: "木" }
        ],
        traceSvg: `<line x1="50" y1="18" x2="50" y2="82" /><path d="M50 44 L32 24 M50 44 L68 24 M50 56 L30 80 M50 56 L70 80"/>`,
        info: {
          zh: "象形字。上端分岔代表向上伸展的繁茂树冠与枝丫，中间立木为主干，下端分张则为深扎于泥土中的庞大根系。《说文》：“木，冒也。冒地而生。象枝柯根茎之形。”",
          en: "Pictograph representing a living tree. The upper strokes illustrate foliage reaching upward, the vertical stroke forms the trunk, and downward roots anchor it firmly into the earth.",
          ms: "Piktograf menggambarkan pokok hidup. Bahagian atas bercabang menunjukkan ranting dahan, tiang tegak ialah batangnya, dan cabang bawah ialah akar tunjang di bumi."
        }
      }
    ];

    // 精炼短标题
    const i18n = {
      zh: {
        tag: "象形",
        title: "字里乾坤",
        choose: "选择字例",
        evo: "字形演变轨迹",
        play: "▶ 动态演示演变过程",
        etym: "造字本义与释读",
        modeDraw: "书写模式",
        modeScroll: "滑屏模式",
        guide: "描红提示",
        brush: "笔触",
        wipe: "清空",
        grade: "测契合度",
        export: "盖印保存",
        congrats: {
          low: "信手涂鸦",
          mid: "略具形貌",
          good: "骨力尽现",
          perfect: "入木三分"
        },
        scoreSub: "契合度"
      },
      en: {
        tag: "Roots",
        title: "Roots",
        choose: "Select Character",
        evo: "Script Evolution Line",
        play: "▶ Play Morphing Animation",
        etym: "Original Meaning & Etymology",
        modeDraw: "Draw Mode",
        modeScroll: "Scroll Mode",
        guide: "Guide",
        brush: "Brush",
        wipe: "Clear",
        grade: "Score",
        export: "Save",
        congrats: {
          low: "Needs Practice",
          mid: "Good Start",
          good: "Well Shaped",
          perfect: "Masterful!"
        },
        scoreSub: "Match Accuracy"
      },
      ms: {
        tag: "Aksara",
        title: "Aksara",
        choose: "Pilih Aksara",
        evo: "Rentetan Evolusi Aksara",
        play: "▶ Mainkan Animasi",
        etym: "Etimologi & Makna Asal",
        modeDraw: "Mod Menulis",
        modeScroll: "Mod Skrol",
        guide: "Panduan",
        brush: "Berus",
        wipe: "Padam",
        grade: "Uji Skor",
        export: "Simpan",
        congrats: {
          low: "Perlu Latihan",
          mid: "Permulaan Baik",
          good: "Bentuk Tepat",
          perfect: "Karya Agung!"
        },
        scoreSub: "Ketepatan"
      }
    };

    let curLang = "zh";
    let curChar = etymologyData[0];
    let currentTraceSvg = curChar.traceSvg;
    let canvasMode = "draw"; // "draw" 或 "scroll"

    function renderCharSelector() {
      const box = document.getElementById("charList");
      box.innerHTML = "";
      etymologyData.forEach(item => {
        const btn = document.createElement("div");
        btn.className = `char-pill ${item.id === curChar.id ? "active" : ""}`;
        btn.onclick = () => selectChar(item.id);
        btn.innerHTML = `
          <svg class="ancient-preview" viewBox="0 0 100 100" stroke="#1b1918" fill="none">
            ${item.steps[0].path}
          </svg>
          <span class="modern-txt">${item.modern}</span>
        `;
        box.appendChild(btn);
      });
    }

    function selectChar(id) {
      curChar = etymologyData.find(c => c.id === id);
      currentTraceSvg = curChar.traceSvg;
      renderCharSelector();
      renderEvolutionLine();
      updateEtymologyText();
      loadTracingGuide();
      wipeBoard();
      hideBadge();
    }

    function renderEvolutionLine() {
      const timeline = document.getElementById("evoTimeline");
      timeline.innerHTML = "";
      curChar.steps.forEach((step, idx) => {
        const item = document.createElement("div");
        item.className = "evo-step";
        const displayName = step.name[curLang] || step.name.zh;
        item.title = `${displayName}`;
        item.onclick = () => {
          if (step.path) {
            currentTraceSvg = step.path;
            document.getElementById("traceBox").innerHTML = `
              <svg viewBox="0 0 100 100">${step.path}</svg>
            `;
          }
        };

        let glyphHtml = "";
        if (step.path) {
          glyphHtml = `<svg viewBox="0 0 100 100">${step.path}</svg>`;
        } else {
          glyphHtml = `<span>${step.text}</span>`;
        }

        item.innerHTML = `
          <div class="evo-glyph">${glyphHtml}</div>
          <div class="evo-name">${displayName}</div>
        `;
        timeline.appendChild(item);
      });
    }

    function loadTracingGuide() {
      const traceBox = document.getElementById("traceBox");
      traceBox.innerHTML = `
        <svg viewBox="0 0 100 100">
          ${currentTraceSvg}
        </svg>
      `;
    }

    function updateEtymologyText() {
      document.getElementById("etymologyContent").innerText = curChar.info[curLang];
    }

    let animTimer = null;
    function playEvolution() {
      clearInterval(animTimer);
      const traceBox = document.getElementById("traceBox");
      let stepIndex = 0;

      animTimer = setInterval(() => {
        const s = curChar.steps[stepIndex];
        if (s.path) {
          traceBox.innerHTML = `<svg viewBox="0 0 100 100" style="stroke: #a62b24;">${s.path}</svg>`;
        } else {
          traceBox.innerHTML = `<span style="font-size: 140px; color: #a62b24;">${s.text}</span>`;
        }

        const stepEls = document.querySelectorAll(".evo-step");
        stepEls.forEach((el, i) => {
          el.style.transform = i === stepIndex ? "scale(1.15)" : "scale(1)";
          el.style.background = i === stepIndex ? "#fae8e6" : "transparent";
        });

        stepIndex++;
        if (stepIndex >= curChar.steps.length) {
          clearInterval(animTimer);
          setTimeout(() => {
            loadTracingGuide();
            stepEls.forEach(el => {
              el.style.transform = "scale(1)";
              el.style.background = "transparent";
            });
          }, 1200);
        }
      }, 700);
    }

    function setLang(lang) {
      curLang = lang;
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");

      const t = i18n[lang];
      document.getElementById("logoTag").innerText = t.tag;
      document.getElementById("mainTitle").innerText = t.title;
      document.getElementById("tChooseChar").innerHTML = `<span>${t.choose}</span>`;
      document.getElementById("tEvolution").innerHTML = `<span>${t.evo}</span>`;
      document.getElementById("btnPlayEvo").innerText = t.play;
      document.getElementById("tEtymology").innerHTML = `<span>${t.etym}</span>`;
      document.getElementById("lblModeDraw").innerText = t.modeDraw;
      document.getElementById("lblModeScroll").innerText = t.modeScroll;
      document.getElementById("txtGuide").innerText = t.guide;
      document.getElementById("txtBrush").innerText = t.brush;
      document.getElementById("btnWipe").innerText = t.wipe;
      document.getElementById("btnGrade").innerText = t.grade;
      document.getElementById("btnExport").innerText = t.export;
      document.getElementById("scoreSub").innerText = t.scoreSub;

      renderEvolutionLine();
      updateEtymologyText();
    }

    // 模式切换控制：书写 vs 滑屏
    function setCanvasMode(mode) {
      canvasMode = mode;
      const c = document.getElementById("paintCanvas");
      const btnDraw = document.getElementById("btnModeDraw");
      const btnScroll = document.getElementById("btnModeScroll");

      if (mode === "scroll") {
        c.classList.add("scroll-mode");
        btnScroll.classList.add("active");
        btnDraw.classList.remove("active");
      } else {
        c.classList.remove("scroll-mode");
        btnDraw.classList.add("active");
        btnScroll.classList.remove("active");
      }
    }

    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false;
    let points = [];

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    function startStroke(e) {
      if (canvasMode === "scroll") return;
      // 如果是多指触摸（如双指缩放滑屏），不拦截，允许系统原生滑屏
      if (e.touches && e.touches.length > 1) return;

      e.preventDefault();
      isDrawing = true;
      const pos = getCoords(e);
      points = [pos];
      drawDot(pos.x, pos.y);
    }

    function moveStroke(e) {
      if (!isDrawing || canvasMode === "scroll") return;
      if (e.touches && e.touches.length > 1) return;

      e.preventDefault();
      const pos = getCoords(e);
      points.push(pos);

      const p1 = points[points.length - 2];
      const p2 = points[points.length - 1];

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = "#1b1918";
      ctx.lineWidth = document.getElementById("penSize").value;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowBlur = 1.5;
      ctx.shadowColor = "#1b1918";
      ctx.stroke();
    }

    function endStroke() {
      isDrawing = false;
      points = [];
    }

    function drawDot(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, document.getElementById("penSize").value / 2, 0, Math.PI * 2);
      ctx.fillStyle = "#1b1918";
      ctx.fill();
    }

    canvas.addEventListener("mousedown", startStroke);
    canvas.addEventListener("mousemove", moveStroke);
    window.addEventListener("mouseup", endStroke);

    canvas.addEventListener("touchstart", startStroke, { passive: false });
    canvas.addEventListener("touchmove", moveStroke, { passive: false });
    window.addEventListener("touchend", endStroke);

    function wipeBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hideBadge();
    }

    function toggleGuide(show) {
      document.getElementById("traceBox").style.opacity = show ? "0.22" : "0";
    }

    // 宽容而有趣的评分算法：骨架大致画出即给 88~98 分
    function evaluateRealScore() {
      const userImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let userPixelCount = 0;
      for (let i = 3; i < userImg.data.length; i += 4) {
        if (userImg.data[i] > 20) userPixelCount++;
      }

      if (userPixelCount < 300) {
        const tip = {
          zh: "画板空空如也，请先挥毫下笔！",
          en: "The canvas is empty, please write something first!",
          ms: "Papan lukis kosong, sila tulis dahulu!"
        };
        alert(tip[curLang] || tip.zh);
        return;
      }

      const offCanvas = document.createElement("canvas");
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext("2d");

      // 采用更宽笔触（18px）作为骨架容差区
      const svgString = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 100 100">
          <g stroke="#000000" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            ${currentTraceSvg}
          </g>
        </svg>
      `;

      const img = new Image();
      const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        offCtx.drawImage(img, 112, 112, 576, 576);
        URL.revokeObjectURL(url);

        const targetData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
        const userData = userImg.data;

        let intersection = 0;
        let targetTotal = 0;

        for (let i = 3; i < targetData.length; i += 16) {
          const tFilled = targetData[i] > 20;
          const uFilled = userData[i] > 20;

          if (tFilled) targetTotal++;
          if (tFilled && uFilled) intersection++;
        }

        const coverage = intersection / (targetTotal || 1);

        // 宽容给分曲线：结构基本出来就保底 88 分起跳
        let calcScore = 0;
        if (coverage < 0.15) {
          calcScore = Math.floor(65 + coverage * 100);
        } else if (coverage < 0.4) {
          calcScore = Math.floor(76 + coverage * 35);
        } else {
          calcScore = Math.min(98, Math.floor(88 + (coverage - 0.4) * 15 + Math.random() * 3));
        }

        const c = i18n[curLang].congrats;
        let verdict = c.mid;
        if (calcScore >= 92) verdict = c.perfect;
        else if (calcScore >= 85) verdict = c.good;
        else if (calcScore < 70) verdict = c.low;

        document.getElementById("scoreVal").innerText = calcScore;
        document.getElementById("scoreVerdict").innerText = verdict;

        const badge = document.getElementById("scoreBadge");
        badge.classList.remove("show");
        void badge.offsetWidth;
        badge.classList.add("show");
      };

      img.src = url;
    }

    function hideBadge() {
      document.getElementById("scoreBadge").classList.remove("show");
    }

    function exportPainting() {
      const out = document.createElement("canvas");
      out.width = canvas.width;
      out.height = canvas.height;
      const oCtx = out.getContext("2d");

      oCtx.fillStyle = "#f6f1e8";
      oCtx.fillRect(0, 0, out.width, out.height);

      oCtx.drawImage(canvas, 0, 0);

      const sz = 100;
      const x = out.width - sz - 35;
      const y = out.height - sz - 35;

      oCtx.strokeStyle = "#a62b24";
      oCtx.lineWidth = 5;
      oCtx.strokeRect(x, y, sz, sz);

      oCtx.fillStyle = "#a62b24";
      oCtx.font = "bold 26px 'Noto Serif SC', serif";
      oCtx.textAlign = "center";
      oCtx.textBaseline = "middle";
      oCtx.fillText("字宝", x + sz / 2, y + sz / 2 - 12);
      oCtx.fillText("传古", x + sz / 2, y + sz / 2 + 18);

      const link = document.createElement("a");
      link.download = `字里乾坤_${curChar.modern}_${Date.now()}.png`;
      link.href = out.toDataURL("image/png");
      link.click();
    }

    renderCharSelector();
    renderEvolutionLine();
    updateEtymologyText();
    loadTracingGuide();
  </script>
