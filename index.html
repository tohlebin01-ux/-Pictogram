<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字里乾坤</title>
  <style>
    :root {
      --paper-base: #f4ede2;
      --paper-texture: #e9decb;
      --ink: #1b1918;
      --cinnabar: #a62b24;
      --wood: #4a3728;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Serif SC", "Kaiti SC", STKaiti, serif;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--paper-base);
      background-image: radial-gradient(var(--paper-texture) 15%, transparent 16%), radial-gradient(var(--paper-texture) 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--wood);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .seal-box {
      background: var(--cinnabar);
      color: #fff;
      font-size: 13px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 1px 1px 0 rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.15rem;
      color: var(--wood);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 功能模式切换：临摹 vs 猜字 */
    .tab-switch {
      display: flex;
      background: #dfd3c1;
      padding: 2px;
      border-radius: 16px;
      gap: 2px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 3px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--wood);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--cinnabar);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .lang-group {
      display: flex;
      gap: 2px;
      background: #e3d8c8;
      padding: 3px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 8px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--wood);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .lang-btn.active {
      background: var(--wood);
      color: #fff;
    }

    /* 主布局 */
    .main-wrap {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 12px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      .main-wrap {
        grid-template-columns: 1fr;
      }
    }

    /* 左侧控制区 */
    .panel {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      border: 1px solid #d5c8b5;
      padding: 16px;
      box-shadow: 0 8px 20px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cinnabar);
      border-left: 4px solid var(--cinnabar);
      padding-left: 8px;
    }

    /* 10 字横向滚动 / 双行网格 */
    .char-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .char-pill {
      border: 1px solid #d3c4af;
      border-radius: 8px;
      padding: 6px 0;
      background: #faf6f0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .char-pill .ancient-preview {
      width: 26px;
      height: 26px;
      fill: var(--ink);
    }

    .char-pill .modern-txt {
      font-size: 11px;
      font-weight: bold;
      margin-top: 2px;
      color: #666;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
    }

    .char-pill .trans-sub {
      font-size: 8px;
      font-weight: normal;
      color: #888;
      transform: scale(0.9);
    }

    .char-pill.active, .char-pill:hover {
      border-color: var(--cinnabar);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(166, 43, 36, 0.15);
    }

    .char-pill.active .modern-txt {
      color: var(--cinnabar);
    }

    .char-pill.active .trans-sub {
      color: var(--cinnabar);
    }

    .evolution-box {
      background: #fdfaf6;
      border: 1px dashed #cfc2ae;
      border-radius: 10px;
      padding: 10px 4px;
    }

    .evolution-timeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      align-items: center;
    }

    .evo-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 1px;
      border-radius: 6px;
      transition: background 0.2s, transform 0.2s;
    }

    .evo-glyph {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .evo-glyph svg {
      width: 100%;
      height: 100%;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .evo-name {
      font-size: 10px;
      color: #7b6d5e;
      font-weight: 600;
      white-space: nowrap;
    }

    .play-morph-btn {
      width: 100%;
      border: 1px solid var(--cinnabar);
      background: #fdf2f1;
      color: var(--cinnabar);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .play-morph-btn:hover {
      background: var(--cinnabar);
      color: white;
    }

    .etymology-box {
      font-size: 0.88rem;
      line-height: 1.65;
      color: #3e3328;
      background: #faf6f0;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #b5a28c;
      white-space: pre-line;
    }

    /* 右侧互动画板区 */
    .workshop {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .touch-mode-switch {
      display: inline-flex;
      background: #e5dac9;
      padding: 3px;
      border-radius: 20px;
      gap: 4px;
      font-size: 0.78rem;
    }

    .touch-btn {
      border: none;
      background: transparent;
      padding: 4px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      color: var(--wood);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .touch-btn.active {
      background: var(--wood);
      color: #fff;
    }

    .canvas-desk {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      background: #fffefb;
      border: 3px solid var(--wood);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .mige {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background:
        linear-gradient(to right, var(--cinnabar) 1px, transparent 1px) 50% 0 / 100% 100%,
        linear-gradient(to bottom, var(--cinnabar) 1px, transparent 1px) 0 50% / 100% 100%,
        linear-gradient(45deg, transparent 49.6%, var(--cinnabar) 50%, transparent 50.4%),
        linear-gradient(-45deg, transparent 49.6%, var(--cinnabar) 50%, transparent 50.4%);
    }

    .trace-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.22;
      transition: opacity 0.3s;
    }

    .trace-layer svg {
      width: 72%;
      height: 72%;
      stroke: var(--ink);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    canvas.scroll-mode {
      pointer-events: none;
    }

    .desk-bar {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      border: 1px solid #dcd1c2;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .desk-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .tools-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .tools-right {
      display: flex;
      gap: 6px;
    }

    .seal-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #555;
    }

    .seal-input {
      width: 60px;
      padding: 3px 6px;
      border: 1px solid #d3c4af;
      border-radius: 4px;
      font-size: 0.8rem;
      text-align: center;
      color: var(--cinnabar);
      font-weight: bold;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #c7b9a5;
      background: white;
      color: var(--wood);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #f4eee3;
    }

    .action-btn.primary {
      background: var(--cinnabar);
      color: white;
      border-color: var(--cinnabar);
    }

    .action-btn.primary:hover {
      background: #8b231c;
    }

    .score-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 96px;
      height: 96px;
      border: 3px dashed var(--cinnabar);
      border-radius: 50%;
      color: var(--cinnabar);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(-15deg) scale(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(255, 240, 240, 0.92);
      pointer-events: none;
      z-index: 20;
    }

    .score-badge.show {
      transform: rotate(-15deg) scale(1);
    }

    .score-num {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1;
    }

    .score-txt {
      font-size: 10px;
      font-weight: bold;
      margin-top: 3px;
    }

    .score-sub {
      font-size: 8px;
      opacity: 0.8;
    }

    /* 猜字游戏区视图 */
    .game-section {
      display: none;
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #d5c8b5;
      box-shadow: 0 10px 30px var(--shadow);
      text-align: center;
    }

    .game-glyph-card {
      width: 160px;
      height: 160px;
      margin: 18px auto;
      border: 2px dashed #d5c8b5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf6f0;
    }

    .game-glyph-card svg {
      width: 80%;
      height: 80%;
      stroke: var(--ink);
      fill: none;
    }

    .game-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .game-opt-btn {
      padding: 12px;
      border: 1px solid #d5c8b5;
      border-radius: 8px;
      background: #fdfaf6;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--wood);
      transition: all 0.2s;
    }

    .game-opt-btn:hover {
      background: #f5ece0;
      border-color: var(--cinnabar);
    }

    .game-feedback {
      margin-top: 16px;
      font-weight: bold;
      min-height: 24px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="seal-box" id="logoTag">象形</div>
        <h1 id="mainTitle">字里乾坤</h1>
      </div>

      <div class="header-right">
        <!-- 模式：书写馆 vs 猜字乐 -->
        <div class="tab-switch">
          <button class="tab-btn active" id="tabStudio" onclick="switchView('studio')">临摹</button>
          <button class="tab-btn" id="tabGame" onclick="switchView('game')">猜字</button>
        </div>

        <div class="lang-group">
          <button class="lang-btn active" onclick="setLang('zh')">中文</button>
          <button class="lang-btn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('ms')">BM</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 视图 1：书写与字形探索馆 -->
  <main class="main-wrap" id="viewStudio">
    <aside class="panel">
      <div>
        <div class="panel-title" id="tChooseChar">
          <span>选择字例 (10字)</span>
        </div>
        <div class="char-selector" id="charList" style="margin-top: 10px;"></div>
      </div>

      <div>
        <div class="panel-title" id="tEvolution">
          <span>字形演变轨迹</span>
        </div>
        <div class="evolution-box" style="margin-top: 10px;">
          <div class="evolution-timeline" id="evoTimeline"></div>
          <button class="play-morph-btn" style="margin-top: 10px;" onclick="playEvolution()" id="btnPlayEvo">
            ▶ 动态演示演变过程
          </button>
        </div>
      </div>

      <div>
        <div class="panel-title" id="tEtymology">
          <span>造字本义与释读</span>
        </div>
        <div class="etymology-box" id="etymologyContent" style="margin-top: 10px;"></div>
      </div>
    </aside>

    <section class="workshop">
      <div class="touch-mode-switch">
        <button class="touch-btn active" id="btnModeDraw" onclick="setCanvasMode('draw')">
          ✍️ <span id="lblModeDraw">书写模式</span>
        </button>
        <button class="touch-btn" id="btnModeScroll" onclick="setCanvasMode('scroll')">
          ✋ <span id="lblModeScroll">滑屏模式</span>
        </button>
      </div>

      <div class="canvas-desk" id="deskContainer">
        <div class="mige"></div>
        <div class="trace-layer" id="traceBox"></div>
        <canvas id="paintCanvas" width="800" height="800"></canvas>
        
        <div class="score-badge" id="scoreBadge">
          <span class="score-num" id="scoreVal">92</span>
          <span class="score-txt" id="scoreVerdict">入木三分</span>
          <span class="score-sub" id="scoreSub">契合度评分</span>
        </div>
      </div>

      <div class="desk-bar">
        <div class="desk-bar-row">
          <div class="tools-left">
            <label style="cursor: pointer;">
              <input type="checkbox" id="chkGuide" checked onchange="toggleGuide(this.checked)">
              <span id="txtGuide">描红提示</span>
            </label>
            <label>
              <span id="txtBrush">笔触</span>:
              <input type="range" id="penSize" min="10" max="36" value="18" style="vertical-align: middle; width: 60px;">
            </label>
          </div>

          <div class="tools-right">
            <button class="action-btn" onclick="wipeBoard()" id="btnWipe">清空</button>
            <button class="action-btn" onclick="evaluateRealScore()" id="btnGrade" style="background: #fdf3e7; color: #a65b00; border-color: #f1cf9b;">
              测契合度
            </button>
            <button class="action-btn primary" onclick="exportPainting()" id="btnExport">盖印保存</button>
          </div>
        </div>

        <!-- 自定义落款印章输入 -->
        <div class="desk-bar-row" style="border-top: 1px dashed #eee; padding-top: 6px;">
          <div class="seal-input-group">
            <span id="lblCustomSeal">落款印章字:</span>
            <input type="text" id="customSealInput" class="seal-input" maxlength="2" value="文心" placeholder="二字">
            <span style="font-size: 0.75rem; color: #999;" id="lblSealTip">(导出时钤盖于文创卡片)</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 视图 2：古字猜猜看游戏 -->
  <section class="game-section" id="viewGame">
    <h2 style="color: var(--wood); margin-bottom: 8px;" id="gameHeading">古字猜猜看</h2>
    <p style="font-size: 0.88rem; color: #666;" id="gameSubHeading">根据甲骨文象形特征，猜猜这是现代的什么字？</p>

    <div class="game-glyph-card" id="gameCard"></div>
    <div class="game-feedback" id="gameFeedback"></div>
    <div class="game-options" id="gameOptions"></div>

    <button class="action-btn" style="margin-top: 20px;" onclick="generateQuiz()" id="btnNextQuiz">换一题</button>
  </section>

  <script>
    // 包含 10 个代表性象形字的数据库（日、月、山、水、人、木、雨、火、鱼、目）
    const etymologyData = [
      {
        id: "sun",
        modern: "日",
        meanings: { zh: "太阳", en: "Sun", ms: "Matahari" },
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<ellipse cx="50" cy="50" rx="30" ry="34" stroke-width="7" stroke="#1b1918" fill="none"/><circle cx="50" cy="50" r="7" fill="#1b1918"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M28 26 C42 22 58 22 72 26 L74 65 C74 76 66 84 50 84 C34 84 26 76 26 65 Z" stroke-width="7" stroke="#1b1918" fill="none"/><line x1="50" y1="46" x2="50" y2="58" stroke-width="8" stroke="#1b1918"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M30 22 L70 22 L70 64 C70 78 30 78 30 64 Z" stroke-width="6" stroke="#1b1918" fill="none"/><line x1="30" y1="48" x2="70" y2="48" stroke-width="6" stroke="#1b1918"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, path: `<path d="M22 28 L24 74 M22 30 L78 30 L76 74 M24 72 L78 72 M25 50 L75 50" stroke-width="8" stroke="#1b1918" fill="none" stroke-linecap="square"/>` },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, path: `<path d="M28 20 L28 80 M28 22 L72 22 L72 80 L66 75 M28 48 L70 48 M28 78 L72 78" stroke-width="6" stroke="#1b1918" fill="none"/>` }
        ],
        traceSvg: `<ellipse cx="50" cy="50" rx="30" ry="34" stroke-width="7" stroke="#1b1918" fill="none"/><circle cx="50" cy="50" r="7" fill="#1b1918"/>`,
        info: {
          zh: "象形字。外层不规则圆轮象征发光浑圆的太阳，中心一实体粗圆点表示并非空心发光体。《说文解字》：“日，实也。太阳之精。象形。”",
          en: "Pictograph representing the Sun. The outer ring denotes its round shape, while the center solid mark signifies a dense, radiant body.",
          ms: "Aksara piktografik melambangkan Matahari. Lingkaran luar menggambarkan bentuk matahari, manakala titik padu di tengah menandakan ketumpatan jasad cakerawala."
        }
      },
      {
        id: "moon",
        modern: "月",
        meanings: { zh: "月亮", en: "Moon", ms: "Bulan" },
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M38 18 C37 40 37 60 38 82 C56 75 66 58 64 24 Z" stroke-width="6" stroke="#1b1918" fill="none"/><ellipse cx="49" cy="50" rx="2.5" ry="6" fill="#1b1918"/>` },

    let curLang = "zh";
    let curChar = etymologyData[0];
    let currentTraceSvg = curChar.traceSvg;
    let canvasMode = "draw";

    // 原生 Web Audio API 合成沉浸式古音磬鸣
    let audioCtx = null;
    function playChimeSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        // 模拟古代编钟/石磬泛音基频
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 音符
        osc.frequency.exponentialRampToValueAtTime(580, audioCtx.currentTime + 1.2);

        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.4);
      } catch (e) {
        // 部分浏览器不支持或限制静音自动播放，平滑忽略
      }
    }

    // 视图切换：临摹馆 vs 猜字乐
    function switchView(view) {
      document.getElementById("tabStudio").classList.toggle("active", view === "studio");
      document.getElementById("tabGame").classList.toggle("active", view === "game");

      document.getElementById("viewStudio").style.display = view === "studio" ? "grid" : "none";
      document.getElementById("viewGame").style.display = view === "game" ? "block" : "none";

      if (view === "game") generateQuiz();
    }

    function renderCharSelector() {
      const box = document.getElementById("charList");
      box.innerHTML = "";
      etymologyData.forEach(item => {
        const btn = document.createElement("div");
        btn.className = `char-pill ${item.id === curChar.id ? "active" : ""}`;
        btn.onclick = () => selectChar(item.id);

        const subText = curLang === "zh" ? item.meanings.zh : item.meanings[curLang];

        btn.innerHTML = `
          <svg class="ancient-preview" viewBox="0 0 100 100" stroke="#1b1918" fill="none">
            ${item.steps[0].path}
          </svg>
          <div class="modern-txt">
            <span>${item.modern}</span>
            <span class="trans-sub">${subText}</span>
          </div>
        `;
        box.appendChild(btn);
      });
    }

    function selectChar(id) {
      curChar = etymologyData.find(c => c.id === id);
      currentTraceSvg = curChar.traceSvg;
      renderCharSelector();
      renderEvolutionLine();
      updateEtymologyText();
      loadTracingGuide();
      wipeBoard();
      hideBadge();
    }

    function renderEvolutionLine() {
      const timeline = document.getElementById("evoTimeline");
      timeline.innerHTML = "";
      curChar.steps.forEach((step) => {
        const item = document.createElement("div");
        item.className = "evo-step";
        const displayName = step.name[curLang] || step.name.zh;
        item.title = `${displayName}`;
        item.onclick = () => {
          if (step.path) {
            currentTraceSvg = step.path;
            document.getElementById("traceBox").innerHTML = `
              <svg viewBox="0 0 100 100">${step.path}</svg>
            `;
          }
        };

        item.innerHTML = `
          <div class="evo-glyph">
            <svg viewBox="0 0 100 100">${step.path}</svg>
          </div>
          <div class="evo-name">${displayName}</div>
        `;
        timeline.appendChild(item);
      });
    }

    function loadTracingGuide() {
      const traceBox = document.getElementById("traceBox");
      traceBox.innerHTML = `
        <svg viewBox="0 0 100 100">
          ${currentTraceSvg}
        </svg>
      `;
    }

    function updateEtymologyText() {
      const meaningLabel = curChar.meanings[curLang];
      const heading = `【${curChar.modern} · ${meaningLabel}】\n\n`;
      document.getElementById("etymologyContent").innerText = heading + curChar.info[curLang];
    }

    let animTimer = null;
    function playEvolution() {
      clearInterval(animTimer);
      const traceBox = document.getElementById("traceBox");
      let stepIndex = 0;

      animTimer = setInterval(() => {
        const s = curChar.steps[stepIndex];
        traceBox.innerHTML = `<svg viewBox="0 0 100 100" style="stroke: #a62b24;">${s.path}</svg>`;

        const stepEls = document.querySelectorAll(".evo-step");
        stepEls.forEach((el, i) => {
          el.style.transform = i === stepIndex ? "scale(1.15)" : "scale(1)";
          el.style.background = i === stepIndex ? "#fae8e6" : "transparent";
        });

        stepIndex++;
        if (stepIndex >= curChar.steps.length) {
          clearInterval(animTimer);
          setTimeout(() => {
            loadTracingGuide();
            stepEls.forEach(el => {
              el.style.transform = "scale(1)";
              el.style.background = "transparent";
            });
          }, 1200);
        }
      }, 700);
    }

    function setLang(lang) {
      curLang = lang;
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");

      const t = i18n[lang];
      document.getElementById("logoTag").innerText = t.tag;
      document.getElementById("mainTitle").innerText = t.title;

      document.getElementById("tChooseChar").innerHTML = `<span>${t.choose}</span>`;

      document.getElementById("btnPlayEvo").innerText = t.play;
      document.getElementById("tEtymology").innerHTML = `<span>${t.etym}</span>`;
      document.getElementById("lblModeDraw").innerText = t.modeDraw;

      document.getElementById("txtGuide").innerText = t.guide;

    function setCanvasMode(mode) {
      canvasMode = mode;
      const c = document.getElementById("paintCanvas");
      const btnDraw = document.getElementById("btnModeDraw");
      const btnScroll = document.getElementById("btnModeScroll");

      if (mode === "scroll") {
        c.classList.add("scroll-mode");
        btnScroll.classList.add("active");
        btnDraw.classList.remove("active");
      } else {
        c.classList.remove("scroll-mode");
        btnDraw.classList.add("active");
        btnScroll.classList.remove("active");
      }
    }

    // 拟真水墨笔触与动态压感
    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let lastTime = 0;
    let currentLineWidth = 18;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    function startStroke(e) {
      if (canvasMode === "scroll") return;
      if (e.touches && e.touches.length > 1) return;

      e.preventDefault();
      isDrawing = true;
      const pos = getCoords(e);
      lastX = pos.x;
      lastY = pos.y;
      lastTime = Date.now();
      currentLineWidth = parseFloat(document.getElementById("penSize").value);

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, currentLineWidth / 2, 0, Math.PI * 2);
      ctx.fillStyle = "#1b1918";
      ctx.fill();
    }

    function moveStroke(e) {
      if (!isDrawing || canvasMode === "scroll") return;
      if (e.touches && e.touches.length > 1) return;

      e.preventDefault();
      const pos = getCoords(e);
      const now = Date.now();
      const dt = Math.max(1, now - lastTime);
      const dx = pos.x - lastX;
      const dy = pos.y - lastY;
      const dist = Math.hypot(dx, dy);

      // 计算速度与动态水墨线宽（下笔快变细，停顿则晕散变粗）
      const speed = dist / dt;
      const baseWidth = parseFloat(document.getElementById("penSize").value);
      const targetWidth = Math.max(baseWidth * 0.45, Math.min(baseWidth * 1.35, baseWidth - speed * 2.8));
      currentLineWidth = currentLineWidth * 0.75 + targetWidth * 0.25;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = "#1b1918";
      ctx.lineWidth = currentLineWidth;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowBlur = 1.2;
      ctx.shadowColor = "#1b1918";
      ctx.stroke();

      lastX = pos.x;
      lastY = pos.y;
      lastTime = now;
    }

    function endStroke() {
      isDrawing = false;
    }

    canvas.addEventListener("mousedown", startStroke);
    canvas.addEventListener("mousemove", moveStroke);
    window.addEventListener("mouseup", endStroke);

    canvas.addEventListener("touchstart", startStroke, { passive: false });
    canvas.addEventListener("touchmove", moveStroke, { passive: false });
    window.addEventListener("touchend", endStroke);

    function wipeBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hideBadge();
    }

    function toggleGuide(show) {
      document.getElementById("traceBox").style.opacity = show ? "0.22" : "0";
    }

    // 宽容而有趣的评分系统
    function evaluateRealScore() {
      const userImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let userPixelCount = 0;
      for (let i = 3; i < userImg.data.length; i += 4) {
        if (userImg.data[i] > 20) userPixelCount++;
      }

      if (userPixelCount < 300) {
        const tip = {
          zh: "画板空空如也，请先挥毫下笔！",
          en: "The canvas is empty, please write something first!",
          ms: "Papan lukis kosong, sila tulis dahulu!"
        };
        alert(tip[curLang] || tip.zh);
        return;
      }

      playChimeSound(); // 触发古磬音效

      const offCanvas = document.createElement("canvas");
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext("2d");

      const svgString = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 100 100">
          <g stroke="#000000" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            ${currentTraceSvg}
          </g>
        </svg>
      `;

      const img = new Image();
      const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        offCtx.drawImage(img, 112, 112, 576, 576);
        URL.revokeObjectURL(url);

        const targetData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
        const userData = userImg.data;

        let intersection = 0;
        let targetTotal = 0;

        for (let i = 3; i < targetData.length; i += 16) {
          const tFilled = targetData[i] > 20;
          const uFilled = userData[i] > 20;

          if (tFilled) targetTotal++;
          if (tFilled && uFilled) intersection++;
        }

        const coverage = intersection / (targetTotal || 1);

        let calcScore = 0;
        if (coverage < 0.15) {
          calcScore = Math.floor(65 + coverage * 100);
        } else if (coverage < 0.4) {
          calcScore = Math.floor(76 + coverage * 35);
        } else {
          calcScore = Math.min(98, Math.floor(88 + (coverage - 0.4) * 15 + Math.random() * 3));
        }

        const c = i18n[curLang].congrats;
        let verdict = c.mid;
        if (calcScore >= 92) verdict = c.perfect;
        else if (calcScore >= 85) verdict = c.good;
        else if (calcScore < 70) verdict = c.low;

        document.getElementById("scoreVal").innerText = calcScore;
        document.getElementById("scoreVerdict").innerText = verdict;

        const badge = document.getElementById("scoreBadge");
        badge.classList.remove("show");
        void badge.offsetWidth;
        badge.classList.add("show");
      };

      img.src = url;
    }

    function hideBadge() {
      document.getElementById("scoreBadge").classList.remove("show");
    }

    // 生成精美竖版文创书签卡片（含专属落款与认证印章）
    function exportPainting() {
      playChimeSound();

      const out = document.createElement("canvas");
      out.width = 900;
      out.height = 1450;
      const o = out.getContext("2d");

      // 宣纸底色与雅致浅边框
      o.fillStyle = "#f6f1e8";
      o.fillRect(0, 0, out.width, out.height);

      o.strokeStyle = "#cfc3b0";
      o.lineWidth = 3;
      o.strokeRect(36, 36, out.width - 72, out.height - 72);

      o.strokeStyle = "#a62b24";
      o.lineWidth = 1;
      o.strokeRect(44, 44, out.width - 88, out.height - 88);

      // 顶部标题栏
      o.fillStyle = "#a62b24";
      o.font = "bold 44px 'PingFang SC', serif";
      o.textAlign = "center";
      o.fillText("字 里 乾 坤", out.width / 2, 125);

      o.fillStyle = "#665747";
      o.font = "20px 'Segoe UI', sans-serif";
      o.fillText("Pictographic Character Workshop", out.width / 2, 165);

      // 字题与三语释义小徽章
      o.fillStyle = "#e9dfce";
      o.fillRect(out.width / 2 - 160, 205, 320, 52);
      o.strokeStyle = "#4a3728";
      o.lineWidth = 2;
      o.strokeRect(out.width / 2 - 160, 205, 320, 52);

      o.fillStyle = "#4a3728";
      o.font = "bold 26px 'PingFang SC', serif";
      const transTitle = `${curChar.modern} · ${curChar.meanings.en} · ${curChar.meanings.ms}`;
      o.fillText(transTitle, out.width / 2, 240);

      // 中间临摹字画展区
      const deskBoxSize = 720;
      const deskX = (out.width - deskBoxSize) / 2;
      const deskY = 290;

      o.fillStyle = "#fffefc";
      o.fillRect(deskX, deskY, deskBoxSize, deskBoxSize);
      o.strokeStyle = "#b5a38b";
      o.lineWidth = 2;
      o.strokeRect(deskX, deskY, deskBoxSize, deskBoxSize);

      // 复制书写墨迹
      o.drawImage(canvas, deskX, deskY, deskBoxSize, deskBoxSize);

      // 右下角：自定义朱砂名章（落款）
      const customSealText = (document.getElementById("customSealInput").value || "文心").trim();
      const sealW = 90;
      const sealX = deskX + deskBoxSize - sealW - 24;
      const sealY = deskY + deskBoxSize - sealW - 24;

      o.strokeStyle = "#a62b24";
      o.lineWidth = 4;
      o.strokeRect(sealX, sealY, sealW, sealW);

      o.fillStyle = "#a62b24";
      o.font = "bold 28px 'Noto Serif SC', serif";
      o.textAlign = "center";
      o.textBaseline = "middle";
      if (customSealText.length === 1) {
        o.fillText(customSealText, sealX + sealW / 2, sealY + sealW / 2);
      } else {
        o.fillText(customSealText.slice(0, 1), sealX + sealW / 2, sealY + sealW / 2 - 14);
        o.fillText(customSealText.slice(1, 2), sealX + sealW / 2, sealY + sealW / 2 + 16);
      }

      // 底部释义段落排版
      o.fillStyle = "#3e3328";
      o.font = "22px 'PingFang SC', serif";
      o.textAlign = "left";
      o.textBaseline = "top";
      const descLine = `造字释义: ${curChar.info.zh.slice(0, 52)}...`;
      o.fillText(descLine, deskX + 8, deskY + deskBoxSize + 36);

      // 最底部防伪印与日期
      o.fillStyle = "#8a7a67";
      o.font = "17px sans-serif";
      const dateStr = new Date().toLocaleDateString();
      o.fillText(`雅赏日期: ${dateStr}`, deskX + 8, deskY + deskBoxSize + 78);

      o.textAlign = "right";
      o.fillText("东方文字美学数字典藏", deskX + deskBoxSize - 8, deskY + deskBoxSize + 78);

      const link = document.createElement("a");
      link.download = `字里乾坤_${curChar.modern}_文创书签.png`;
      link.href = out.toDataURL("image/png");
      link.click();
    }

    // 古字猜猜看游戏引擎
    let currentQuizChar = null;
    function generateQuiz() {
      document.getElementById("gameFeedback").innerText = "";
      const randomIdx = Math.floor(Math.random() * etymologyData.length);
      currentQuizChar = etymologyData[randomIdx];

      // 渲染甲骨文字形
      document.getElementById("gameCard").innerHTML = `
        <svg viewBox="0 0 100 100" stroke-width="7" stroke="#1b1918" fill="none">
          ${currentQuizChar.steps[0].path}
        </svg>
      `;

      // 抽取 3 个干扰项
      const choices = [currentQuizChar];
      while (choices.length < 4) {
        const r = etymologyData[Math.floor(Math.random() * etymologyData.length)];
        if (!choices.some(c => c.id === r.id)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      const optBox = document.getElementById("gameOptions");
      optBox.innerHTML = "";
      choices.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "game-opt-btn";
        const label = curLang === "zh" ? `${c.modern} (${c.meanings.zh})` : `${c.modern} - ${c.meanings[curLang]}`;
        btn.innerText = label;
        btn.onclick = () => checkQuizAnswer(c.id);
        optBox.appendChild(btn);
      });
    }

    function checkQuizAnswer(selectedId) {
      const fb = document.getElementById("gameFeedback");
      if (selectedId === currentQuizChar.id) {
        playChimeSound();
        fb.style.color = "#2b7a3e";
        fb.innerText = i18n[curLang].gameCorrect;
        setTimeout(() => {
          selectChar(currentQuizChar.id);
          switchView("studio");
        }, 1200);
      } else {
        fb.style.color = "#a62b24";
        fb.innerText = i18n[curLang].gameWrong;
      }
    }

    // 初始化运行
    renderCharSelector();
    renderEvolutionLine();
    updateEtymologyText();
    loadTracingGuide();
  </script>
