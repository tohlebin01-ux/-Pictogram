<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字里乾坤</title>
  <style>
    :root {
      --paper-base: #f4ede2;
      --paper-texture: #e9decb;
      --ink: #1b1918;
      --cinnabar: #a62b24;
      --wood: #4a3728;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Serif SC", "Kaiti SC", STKaiti, serif;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--paper-base);
      background-image: radial-gradient(var(--paper-texture) 15%, transparent 16%), radial-gradient(var(--paper-texture) 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--wood);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .seal-box {
      background: var(--cinnabar);
      color: #fff;
      font-size: 13px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 1px 1px 0 rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.15rem;
      color: var(--wood);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .lang-group {
      display: flex;
      gap: 2px;
      background: #e3d8c8;
      padding: 3px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--wood);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .lang-btn.active {
      background: var(--wood);
      color: #fff;
    }

    /* 主布局 */
    .main-wrap {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 12px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      .main-wrap {
        grid-template-columns: 1fr;
      }
    }

    /* 左侧控制区 */
    .panel {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      border: 1px solid #d5c8b5;
      padding: 16px;
      box-shadow: 0 8px 20px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cinnabar);
      border-left: 4px solid var(--cinnabar);
      padding-left: 8px;
    }

    .char-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .char-pill {
      border: 1px solid #d3c4af;
      border-radius: 8px;
      padding: 8px 0;
      background: #faf6f0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .char-pill .ancient-preview {
      width: 26px;
      height: 26px;
      fill: var(--ink);
    }

    .char-pill .modern-txt {
      font-size: 11px;
      font-weight: bold;
      margin-top: 2px;
      color: #666;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
    }

    .char-pill .trans-sub {
      font-size: 8px;
      font-weight: normal;
      color: #888;
      transform: scale(0.9);
    }

    .char-pill.active, .char-pill:hover {
      border-color: var(--cinnabar);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(166, 43, 36, 0.15);
    }

    .char-pill.active .modern-txt {
      color: var(--cinnabar);
    }

    .char-pill.active .trans-sub {
      color: var(--cinnabar);
    }

    .evolution-box {
      background: #fdfaf6;
      border: 1px dashed #cfc2ae;
      border-radius: 10px;
      padding: 10px 4px;
    }

    .evolution-timeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      align-items: center;
    }

    .evo-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 1px;
      border-radius: 6px;
      transition: background 0.2s, transform 0.2s;
    }

    .evo-glyph {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .evo-glyph svg {
      width: 100%;
      height: 100%;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .evo-name {
      font-size: 10px;
      color: #7b6d5e;
      font-weight: 600;
      white-space: nowrap;
    }

    .play-morph-btn {
      width: 100%;
      border: 1px solid var(--cinnabar);
      background: #fdf2f1;
      color: var(--cinnabar);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .play-morph-btn:hover {
      background: var(--cinnabar);
      color: white;
    }

    .etymology-box {
      font-size: 0.88rem;
      line-height: 1.65;
      color: #3e3328;
      background: #faf6f0;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #b5a28c;
      white-space: pre-line;
    }

    /* 右侧互动画板区 */
    .workshop {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .touch-mode-switch {
      display: inline-flex;
      background: #e5dac9;
      padding: 3px;
      border-radius: 20px;
      gap: 4px;
      font-size: 0.78rem;
    }

    .touch-btn {
      border: none;
      background: transparent;
      padding: 4px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      color: var(--wood);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .touch-btn.active {
      background: var(--wood);
      color: #fff;
    }

    .canvas-desk {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      background: #fffefb;
      border: 3px solid var(--wood);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .mige {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background:
        linear-gradient(to right, var(--cinnabar) 1px, transparent 1px) 50% 0 / 100% 100%,
        linear-gradient(to bottom, var(--cinnabar) 1px, transparent 1px) 0 50% / 100% 100%,
        linear-gradient(45deg, transparent 49.6%, var(--cinnabar) 50%, transparent 50.4%),
        linear-gradient(-45deg, transparent 49.6%, var(--cinnabar) 50%, transparent 50.4%);
    }

    .trace-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.22;
      transition: opacity 0.3s;
    }

    .trace-layer svg {
      width: 72%;
      height: 72%;
      stroke: var(--ink);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    canvas.scroll-mode {
      pointer-events: none;
    }

    .desk-bar {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      border: 1px solid #dcd1c2;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .desk-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .tools-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .tools-right {
      display: flex;
      gap: 6px;
    }

    .seal-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #555;
    }

    .seal-input {
      width: 60px;
      padding: 3px 6px;
      border: 1px solid #d3c4af;
      border-radius: 4px;
      font-size: 0.8rem;
      text-align: center;
      color: var(--cinnabar);
      font-weight: bold;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #c7b9a5;
      background: white;
      color: var(--wood);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #f4eee3;
    }

    .action-btn.primary {
      background: var(--cinnabar);
      color: white;
      border-color: var(--cinnabar);
    }

    .action-btn.primary:hover {
      background: #8b231c;
    }

    .score-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 96px;
      height: 96px;
      border: 3px dashed var(--cinnabar);
      border-radius: 50%;
      color: var(--cinnabar);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(-15deg) scale(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(255, 240, 240, 0.92);
      pointer-events: none;
      z-index: 20;
    }

    .score-badge.show {
      transform: rotate(-15deg) scale(1);
    }

    .score-num {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1;
    }

    .score-txt {
      font-size: 10px;
      font-weight: bold;
      margin-top: 3px;
    }

    .score-sub {
      font-size: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="seal-box" id="logoTag">象形</div>
        <h1 id="mainTitle">字里乾坤</h1>
      </div>

      <div class="lang-group">
        <button class="lang-btn active" onclick="setLang('zh')">中文</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ms')">BM</button>
      </div>
    </div>
  </header>

  <main class="main-wrap">
    <aside class="panel">
      <div>
        <div class="panel-title" id="tChooseChar">
          <span>选择字例</span>
        </div>
        <div class="char-selector" id="charList" style="margin-top: 10px;"></div>
      </div>

      <div>
        <div class="panel-title" id="tEvolution">
          <span>字形演变轨迹</span>
        </div>
        <div class="evolution-box" style="margin-top: 10px;">
          <div class="evolution-timeline" id="evoTimeline"></div>
          <button class="play-morph-btn" style="margin-top: 10px;" onclick="playEvolution()" id="btnPlayEvo">
            ▶ 动态演示演变过程
          </button>
        </div>
      </div>

      <div>
        <div class="panel-title" id="tEtymology">
          <span>造字本义与释读</span>
        </div>
        <div class="etymology-box" id="etymologyContent" style="margin-top: 10px;"></div>
      </div>
    </aside>

    <section class="workshop">
      <div class="touch-mode-switch">
        <button class="touch-btn active" id="btnModeDraw" onclick="setCanvasMode('draw')">
          ✍️ <span id="lblModeDraw">书写模式</span>
        </button>
        <button class="touch-btn" id="btnModeScroll" onclick="setCanvasMode('scroll')">
          ✋ <span id="lblModeScroll">滑屏模式</span>
        </button>
      </div>

      <div class="canvas-desk" id="deskContainer">
        <div class="mige"></div>
        <div class="trace-layer" id="traceBox"></div>
        <canvas id="paintCanvas" width="800" height="800"></canvas>
        
        <div class="score-badge" id="scoreBadge">
          <span class="score-num" id="scoreVal">92</span>
          <span class="score-txt" id="scoreVerdict">入木三分</span>
          <span class="score-sub" id="scoreSub">契合度评分</span>
        </div>
      </div>

      <div class="desk-bar">
        <div class="desk-bar-row">
          <div class="tools-left">
            <label style="cursor: pointer;">
              <input type="checkbox" id="chkGuide" checked onchange="toggleGuide(this.checked)">
              <span id="txtGuide">描红提示</span>
            </label>
            <label>
              <span id="txtBrush">笔触</span>:
              <input type="range" id="penSize" min="10" max="36" value="18" style="vertical-align: middle; width: 60px;">
            </label>
          </div>

          <div class="tools-right">
            <button class="action-btn" onclick="wipeBoard()" id="btnWipe">清空</button>
            <button class="action-btn" onclick="evaluateRealScore()" id="btnGrade" style="background: #fdf3e7; color: #a65b00; border-color: #f1cf9b;">
              测契合度
            </button>
            <button class="action-btn primary" onclick="exportPainting()" id="btnExport">盖印保存</button>
          </div>
        </div>

        <!-- 自定义落款印章输入 -->
        <div class="desk-bar-row" style="border-top: 1px dashed #eee; padding-top: 6px;">
          <div class="seal-input-group">
            <span id="lblCustomSeal">落款印章字:</span>
            <input type="text" id="customSealInput" class="seal-input" maxlength="2" value="文心" placeholder="二字">
            <span style="font-size: 0.75rem; color: #999;" id="lblSealTip">(导出时钤盖于文创卡片)</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 严谨保留 6 个核心字：日、月、山、水、人、目
    const etymologyData = [
      {
        id: "sun",
        modern: "日",
        meanings: { zh: "太阳", en: "Sun", ms: "Matahari" },
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<ellipse cx="50" cy="50" rx="30" ry="34" stroke-width="7" stroke="#1b1918" fill="none"/><circle cx="50" cy="50" r="7" fill="#1b1918"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M28 26 C42 22 58 22 72 26 L74 65 C74 76 66 84 50 84 C34 84 26 76 26 65 Z" stroke-width="7" stroke="#1b1918" fill="none"/><line x1="50" y1="46" x2="50" y2="58" stroke-width="8" stroke="#1b1918"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M30 22 L70 22 L70 64 C70 78 30 78 30 64 Z" stroke-width="6" stroke="#1b1918" fill="none"/><line x1="30" y1="48" x2="70" y2="48" stroke-width="6" stroke="#1b1918"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, path: `<path d="M22 28 L24 74 M22 30 L78 30 L76 74 M24 72 L78 72 M25 50 L75 50" stroke-width="8" stroke="#1b1918" fill="none" stroke-linecap="square"/>` },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, path: `<path d="M28 20 L28 80 M28 22 L72 22 L72 80 L66 75 M28 48 L70 48 M28 78 L72 78" stroke-width="6" stroke="#1b1918" fill="none"/>` }
        ],
        traceSvg: `<ellipse cx="50" cy="50" rx="30" ry="34" stroke-width="7" stroke="#1b1918" fill="none"/><circle cx="50" cy="50" r="7" fill="#1b1918"/>`,
        info: {
          zh: "象形字。外层不规则圆轮象征发光浑圆的太阳，中心一实体粗圆点表示并非空心发光体。《说文解字》：“日，实也。太阳之精。象形。”",
          en: "Pictograph representing the Sun. The outer ring denotes its round shape, while the center solid mark signifies a dense, radiant body.",
          ms: "Aksara piktografik melambangkan Matahari. Lingkaran luar menggambarkan bentuk matahari, manakala titik padu di tengah menandakan ketumpatan jasad cakerawala."
        }
      },
      {
        id: "moon",
        modern: "月",
        meanings: { zh: "月亮", en: "Moon", ms: "Bulan" },
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M38 18 C37 40 37 60 38 82 C56 75 66 58 64 24 Z" stroke-width="6" stroke="#1b1918" fill="none"/><ellipse cx="49" cy="50" rx="2.5" ry="6" fill="#1b1918"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M32 20 C50 22 66 38 66 56 C66 74 35 84 32 84 C48 72 48 34 32 20 Z" stroke-width="7" stroke="#1b1918" fill="none"/><line x1="49" y1="46" x2="49" y2="58" stroke-width="7" stroke="#1b1918"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M36 28 C50 16 66 22 66 46 C66 68 46 80 46 90" stroke-width="6" stroke="#1b1918" fill="none"/><line x1="36" y1="42" x2="58" y2="42" stroke-width="5" stroke="#1b1918"/><line x1="38" y1="62" x2="56" y2="62" stroke-width="5" stroke="#1b1918"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, path: `<path d="M34 22 C32 46 26 66 18 80 M34 25 L74 25 L74 78 C74 81 70 82 64 82 M34 44 L70 44 M32 62 L70 62" stroke-width="7" stroke="#1b1918" fill="none"/>` },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, path: `<path d="M36 18 C35 48 30 72 16 86 M36 22 L72 22 L72 82 L65 74 M36 44 L70 44 M35 62 L70 62" stroke-width="6" stroke="#1b1918" fill="none"/>` }
        ],
        traceSvg: `<path d="M38 18 C37 40 37 60 38 82 C56 75 66 58 64 24 Z" stroke-width="6" stroke="#1b1918" fill="none"/><ellipse cx="49" cy="50" rx="2.5" ry="6" fill="#1b1918"/>`,
        info: {
          zh: "象形字。古人绘制月亮特意采用半弦月/娥眉月形态，并在内侧加一阴影竖画，以此与浑圆的“日”区分。《说文》：“月，阙也。太阴之精。”",
          en: "Pictograph representing the Moon. Drawn as a crescent with a core mark to capture waxing and waning phases, distinguishing it from the round sun.",
          ms: "Aksara piktografik melambangkan Bulan. Dilukis dalam bentuk anak bulan sabit untuk mencerminkan fasanya yang berubah-ubah."
        }
      },
      {
        id: "mountain",
        modern: "山",
        meanings: { zh: "山峦", en: "Mountain", ms: "Gunung" },
        steps: [
          { name: { zh: "甲骨文", en: "Oracle", ms: "Tulang" }, path: `<path d="M18 78 L28 32 L40 78 M36 78 L50 20 L64 78 M60 78 L72 36 L82 78 M18 78 L82 78" stroke-width="6" stroke="#1b1918" fill="none"/>` },
          { name: { zh: "金文", en: "Bronze", ms: "Gangsa" }, path: `<path d="M22 48 L22 75 L78 75 L78 48 M50 20 L50 75" stroke-width="7" stroke="#1b1918" fill="none"/>` },
          { name: { zh: "小篆", en: "Seal", ms: "Cop" }, path: `<path d="M26 24 L26 62 C26 76 74 76 74 62 L74 24 M50 16 L50 64 M34 72 L50 60 L66 72" stroke-width="6" stroke="#1b1918" fill="none"/>` },
          { name: { zh: "隶书", en: "Clerical", ms: "Kani" }, path: `<path d="M50 22 L50 68 M20 48 L20 70 L86 70 M82 48 L82 70" stroke-width="8" stroke="#1b1918" fill="none"/>` },
          { name: { zh: "楷书", en: "Regular", ms: "Biasa" }, path: `<path d="M50 16 L50 78 M24 40 L24 74 L78 74 M78 40 L78 74" stroke-width="6" stroke="#1b1918" fill="none"/>` }

          zh: "象形字。甲骨文宛如大地上矗立的三座险峻山峰，中间主峰突起，两侧侧峰环绕，底部基石相连。《说文》：“山，宣也。有石而高。”",
          en: "Pictograph representing Mountains. Depicts three peaks rising side by side from a shared base line, with the tallest peak elevated at the center.",
          ms: "Aksara piktografik melambangkan Gunung. Menggambarkan formasi tiga puncak banjaran di atas tanah dengan puncak tertinggi di tengah."
        }
      },
      {
        id: "water",
        modern: "水",

    let animTimer = null;

      animTimer = setInterval(() => {

        traceBox.innerHTML = `<svg viewBox="0 0 100 100" style="stroke: #a62b24;">${s.path}</svg>`;

        const stepEls = document.querySelectorAll(".evo-step");
        stepEls.forEach((el, i) => {
          el.style.transform = i === stepIndex ? "scale(1.15)" : "scale(1)";
          el.style.background = i === stepIndex ? "#fae8e6" : "transparent";
        });

        stepIndex++;
        if (stepIndex >= curChar.steps.length) {
          clearInterval(animTimer);
          setTimeout(() => {
            loadTracingGuide();
            stepEls.forEach(el => {
              el.style.transform = "scale(1)";
              el.style.background = "transparent";
            });

    function setCanvasMode(mode) {

      if (mode === "scroll") {

    // 动态水墨笔触与速度压感
    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let lastTime = 0;
    let currentLineWidth = 18;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    function startStroke(e) {
      if (canvasMode === "scroll") return;
      if (e.touches && e.touches.length > 1) return;

      e.preventDefault();
      isDrawing = true;
      const pos = getCoords(e);
      lastX = pos.x;
      lastY = pos.y;
      lastTime = Date.now();
      currentLineWidth = parseFloat(document.getElementById("penSize").value);

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, currentLineWidth / 2, 0, Math.PI * 2);
      ctx.fillStyle = "#1b1918";
      ctx.fill();
    }

    function moveStroke(e) {
      if (!isDrawing || canvasMode === "scroll") return;
      if (e.touches && e.touches.length > 1) return;

      e.preventDefault();
      const pos = getCoords(e);
      const now = Date.now();
      const dt = Math.max(1, now - lastTime);
      const dx = pos.x - lastX;
      const dy = pos.y - lastY;
      const dist = Math.hypot(dx, dy);

      const speed = dist / dt;
      const baseWidth = parseFloat(document.getElementById("penSize").value);
      const targetWidth = Math.max(baseWidth * 0.45, Math.min(baseWidth * 1.35, baseWidth - speed * 2.8));
      currentLineWidth = currentLineWidth * 0.75 + targetWidth * 0.25;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = "#1b1918";
      ctx.lineWidth = currentLineWidth;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowBlur = 1.2;
      ctx.shadowColor = "#1b1918";
      ctx.stroke();

      lastX = pos.x;
      lastY = pos.y;
      lastTime = now;
    }

    function endStroke() {
      isDrawing = false;
    }

    canvas.addEventListener("mousedown", startStroke);
    canvas.addEventListener("mousemove", moveStroke);
    window.addEventListener("mouseup", endStroke);

    canvas.addEventListener("touchstart", startStroke, { passive: false });
    canvas.addEventListener("touchmove", moveStroke, { passive: false });
    window.addEventListener("touchend", endStroke);

    function wipeBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hideBadge();
    }

    // 宽松契合度评分
    function evaluateRealScore() {
      const userImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let userPixelCount = 0;
      for (let i = 3; i < userImg.data.length; i += 4) {
        if (userImg.data[i] > 20) userPixelCount++;
      }

      if (userPixelCount < 300) {
        const tip = {
          zh: "画板空空如也，请先挥毫下笔！",
          en: "The canvas is empty, please write something first!",
          ms: "Papan lukis kosong, sila tulis dahulu!"
        };
        alert(tip[curLang] || tip.zh);
        return;
      }

      const offCanvas = document.createElement("canvas");
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext("2d");

      const svgString = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 100 100">
          <g stroke="#000000" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            ${currentTraceSvg}
          </g>
        </svg>
      `;

      const img = new Image();
      const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        offCtx.drawImage(img, 112, 112, 576, 576);
        URL.revokeObjectURL(url);

        const targetData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
        const userData = userImg.data;

        let intersection = 0;
        let targetTotal = 0;

        for (let i = 3; i < targetData.length; i += 16) {
          const tFilled = targetData[i] > 20;
          const uFilled = userData[i] > 20;

          if (tFilled) targetTotal++;
          if (tFilled && uFilled) intersection++;
        }

        const coverage = intersection / (targetTotal || 1);

        let calcScore = 0;
        if (coverage < 0.15) {
          calcScore = Math.floor(65 + coverage * 100);
        } else if (coverage < 0.4) {
          calcScore = Math.floor(76 + coverage * 35);
        } else {
          calcScore = Math.min(98, Math.floor(88 + (coverage - 0.4) * 15 + Math.random() * 3));
        }

        const c = i18n[curLang].congrats;
        let verdict = c.mid;
        if (calcScore >= 92) verdict = c.perfect;
        else if (calcScore >= 85) verdict = c.good;
        else if (calcScore < 70) verdict = c.low;

        document.getElementById("scoreVal").innerText = calcScore;
        document.getElementById("scoreVerdict").innerText = verdict;

        const badge = document.getElementById("scoreBadge");
        badge.classList.remove("show");
        void badge.offsetWidth;
        badge.classList.add("show");
      };

      img.src = url;
    }

    function hideBadge() {
      document.getElementById("scoreBadge").classList.remove("show");
    }

    // 重新设计的典雅东方文创书签（竖版古籍美学）
    function exportPainting() {
      const out = document.createElement("canvas");
      out.width = 680;
      out.height = 1420;
      const o = out.getContext("2d");

      // 1. 底色：温润天然宣纸色
      o.fillStyle = "#f7f3eb";
      o.fillRect(0, 0, out.width, out.height);

      // 2. 边框：双层宋锦细边线
      o.strokeStyle = "#cfc4b0";
      o.lineWidth = 1.5;
      o.strokeRect(32, 32, out.width - 64, out.height - 64);

      o.strokeStyle = "#a62b24";
      o.lineWidth = 2.5;
      o.strokeRect(42, 42, out.width - 84, out.height - 84);

      // 四角装饰回纹折角
      const corner = (x, y, dx, dy) => {
        o.beginPath();
        o.moveTo(x + dx * 16, y);
        o.lineTo(x, y);
        o.lineTo(x, y + dy * 16);
        o.strokeStyle = "#a62b24";
        o.lineWidth = 2.5;
        o.stroke();
      };
      corner(42, 42, 1, 1);
      corner(out.width - 42, 42, -1, 1);
      corner(42, out.height - 42, 1, -1);
      corner(out.width - 42, out.height - 42, -1, -1);

      // 3. 顶部：引首章与馆藏主题
      o.save();
      o.strokeStyle = "#a62b24";
      o.lineWidth = 2.5;
      o.beginPath();
      o.ellipse(90, 95, 18, 32, 0, 0, Math.PI * 2);
      o.stroke();
      o.fillStyle = "#a62b24";
      o.font = "bold 15px 'Noto Serif SC', serif";
      o.textAlign = "center";
      o.textBaseline = "middle";
      o.fillText("溯", 90, 84);
      o.fillText("古", 90, 106);
      o.restore();

      // 主题字：字里乾坤
      o.fillStyle = "#3e3226";
      o.font = "600 24px 'Noto Serif SC', 'Kaiti SC', serif";
      o.textAlign = "center";
      o.letterSpacing = "6px";
      o.fillText("字 里 乾 坤", out.width / 2, 95);

      // 细装饰线
      o.strokeStyle = "#d6cbba";
      o.lineWidth = 1;
      o.beginPath();
      o.moveTo(140, 135);
      o.lineTo(out.width - 140, 135);
      o.stroke();

      // 4. 字名与三语物象标签
      o.fillStyle = "#a62b24";
      o.font = "bold 46px 'Kaiti SC', STKaiti, serif";
      o.textAlign = "center";
      o.fillText(curChar.modern, out.width / 2, 195);

      o.fillStyle = "#7a6b5c";
      o.font = "14px -apple-system, sans-serif";
      o.letterSpacing = "2px";
      const subTitle = `${curChar.meanings.zh}  ·  ${curChar.meanings.en}  ·  ${curChar.meanings.ms}`;
      o.fillText(subTitle, out.width / 2, 230);

      // 5. 画心展区（自然融入宣纸，去除沉重方黑框）
      const artSize = 480;
      const artX = (out.width - artSize) / 2;
      const artY = 270;

      // 浅色米字格打底
      o.save();
      o.strokeStyle = "#ece3d3";
      o.lineWidth = 1;
      o.strokeRect(artX, artY, artSize, artSize);
      o.beginPath();
      o.moveTo(artX + artSize / 2, artY);
      o.lineTo(artX + artSize / 2, artY + artSize);
      o.moveTo(artX, artY + artSize / 2);
      o.lineTo(artX + artSize, artY + artSize / 2);
      o.stroke();
      o.restore();

      // 绘制用户挥毫墨宝
      o.drawImage(canvas, artX, artY, artSize, artSize);

      // 6. 右下角落款朱砂名章
      const sealName = (document.getElementById("customSealInput").value || "文心").trim();
      const sSize = 74;
      const sX = artX + artSize - sSize - 12;
      const sY = artY + artSize - sSize - 12;

      o.fillStyle = "rgba(166, 43, 36, 0.06)";
      o.fillRect(sX, sY, sSize, sSize);
      o.strokeStyle = "#a62b24";
      o.lineWidth = 3.5;
      o.strokeRect(sX, sY, sSize, sSize);

      o.fillStyle = "#a62b24";
      o.font = "bold 24px 'Noto Serif SC', serif";
      o.textAlign = "center";
      o.textBaseline = "middle";
      if (sealName.length === 1) {
        o.fillText(sealName, sX + sSize / 2, sY + sSize / 2);
      } else {
        o.fillText(sealName.slice(0, 1), sX + sSize / 2, sY + sSize / 2 - 12);
        o.fillText(sealName.slice(1, 2), sX + sSize / 2, sY + sSize / 2 + 14);
      }

      // 7. 下半部：中式竖向古典文本排版（右起竖排）
      const descText = curChar.info.zh.replace(/《|》|“|”/g, "");
      const colXStart = out.width - 130;
      const colYStart = 800;
      const lineHeight = 28;
      const colWidth = 34;
      const maxLines = 14;

      o.save();
      o.fillStyle = "#4a3c30";
      o.font = "17px 'Noto Serif SC', 'Kaiti SC', serif";
      o.textAlign = "center";

      let charIdx = 0;
      for (let col = 0; col < 6 && charIdx < descText.length; col++) {
        const curColX = colXStart - col * colWidth;
        for (let row = 0; row < maxLines && charIdx < descText.length; row++) {
          const ch = descText[charIdx++];
          o.fillText(ch, curColX, colYStart + row * lineHeight);
        }
      }
      o.restore();

      // 8. 底部题花与典藏信息
      o.strokeStyle = "#d6cbba";
      o.beginPath();
      o.moveTo(100, 1290);
      o.lineTo(out.width - 100, 1290);
      o.stroke();

      o.fillStyle = "#968776";
      o.font = "13px -apple-system, sans-serif";
      o.textAlign = "center";
      o.letterSpacing = "1.5px";
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, " . ");
      o.fillText(`东方文字美学数字工坊  ·  ${today}`, out.width / 2, 1330);

      // 下载生成的文件
      const link = document.createElement("a");
      link.download = `字里乾坤_${curChar.modern}_文创书签.png`;
      link.href = out.toDataURL("image/png");
      link.click();
    }

    // 页面初始化
    renderCharSelector();
    renderEvolutionLine();
    updateEtymologyText();
    loadTracingGuide();
  </script>
</body>
</html>
